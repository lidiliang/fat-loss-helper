services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qingzhi
      POSTGRES_USER: qingzhi
      POSTGRES_PASSWORD: qingzhi
    volumes:
      - qingzhi_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qingzhi -d qingzhi"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"

  api:
    image: "${API_IMAGE:-fat-loss-helper-api:latest}"
    build: ./server
    restart: unless-stopped
    environment:
      GIN_MODE: release
      PORT: "8080"
      DATABASE_URL: postgres://qingzhi:qingzhi@postgres:5432/qingzhi?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?请先设置至少32位的JWT_SECRET}
      ALLOW_ORIGIN: "*"
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-flash}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-50}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-5003}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  qingzhi_postgres:
